<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fy-desktop</title>
  <link rel="stylesheet" href="css/app.css" />
</head>

<body data-material="glass" data-edit="0">
  <!-- 舞台按缩放比整体放大，内部一律用「设计像素」布局 -->
  <div id="stage">
    <div id="widgets"></div>
    <section id="organizer" class="panel"></section>
    <div id="editbar" hidden>
      <button data-act="add" class="ebtn">＋ 添加组件</button>
      <button data-act="done" class="ebtn primary">完成</button>
      <span class="ehint">拖动卡片移动 · 右下角拖动改大小</span>
    </div>
  </div>

  <div id="gallery" hidden></div>
  <div id="menu" hidden></div>
  <div id="toast" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>

</html>
