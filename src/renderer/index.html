<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fy-desktop</title>
  <link rel="stylesheet" href="css/app.css" />
</head>

<body data-material="glass" data-edit="0">
  <!-- 舞台按缩放比整体放大，内部一律用「设计像素」布局 -->
  <div id="stage">
    <div id="widgets"></div>
    <section id="organizer" class="panel"></section>
    <!-- 系统入口的全部入口浮层：位置用设计像素，跟着 #stage 一起缩放 -->
    <div id="launcher-pop" hidden></div>
    <div id="editbar" hidden>
      <button data-act="add" class="ebtn">＋ 添加组件</button>
      <button data-act="done" class="ebtn primary">完成</button>
      <span class="ehint">拖动卡片调整位置 · 右键卡片可改尺寸 / 移除</span>
    </div>
  </div>

  <div id="menu" hidden></div>
  <!-- 托盘菜单不在这里：它有独立窗口 traypop（traymenu.html），
       否则会被压在 alwaysOnBottom 的桌面层里，被别的窗口盖住 -->
  <div id="toast" hidden></div>

  <!-- 兜底错误屏放成外部脚本：CSP 只允许 'self'，内联脚本会被拦掉 -->
  <script src="js/fallback.js"></script>

  <script type="module" src="js/main.js"></script>
</body>

</html>
