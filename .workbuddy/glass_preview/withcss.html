<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../src/renderer/css/app.css"><style>
body { background: linear-gradient(120deg, #1b2a4a 0%, #6d3a6e 38%, #c2543a 70%, #2a1a30 100%); }
.surface::before { transition: none !important; }
.card { position: absolute; width: 240px; height: 150px; --shot-w: 1200px; --shot-h: 420px; --shot-x: -30px; --shot-y: -30px; }
.k1 { left: 30px; top: 30px; }
.k2 { left: 300px; top: 30px; }
.k3 { left: 30px; top: 210px; background: none; }
.k3::before { background-image: linear-gradient(var(--veil), var(--veil)), var(--shot, none); background-size: 100% 100%, 240px 150px; }
</style></head>
<body data-glass="1" data-material="glass">
<div class="surface card k1"><div class="body">card via app.css ::before</div></div>
<div class="surface card k2"><div class="body">card 2</div></div>
<div class="surface card k3"><div class="body">no sheen layer</div></div>
</body></html>
